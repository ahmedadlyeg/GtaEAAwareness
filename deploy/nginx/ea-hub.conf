# EA Awareness Hub — nginx reverse proxy
# Install:
#   sudo cp deploy/nginx/ea-hub.conf /etc/nginx/sites-available/ea-hub
#   # replace YOUR_DOMAIN below first (sudo nano /etc/nginx/sites-available/ea-hub)
#   sudo ln -s /etc/nginx/sites-available/ea-hub /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see deploy/DEPLOY.md) — it rewrites this file to add TLS + the :443 block.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Max upload / body size (the API caps JSON at 256 KB anyway)
    client_max_body_size 1m;

    # Proxy everything to the Node app (it serves both the SPA and /api/v1)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Liveness probe (optional convenience)
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }
}
